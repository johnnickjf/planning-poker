<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Planning Poker</title>
  <meta name="description" content="Planning Poker em tempo real, sem login. Crie uma sala e compartilhe o link com o time.">
  <meta name="theme-color" content="#020617">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🃏%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <noscript><p class="noscript">Este site precisa de JavaScript habilitado.</p></noscript>

  <!-- ===================== Carregando ===================== -->
  <main id="screen-loading" class="screen screen-center">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text" class="muted" role="status">Carregando…</p>
  </main>

  <!-- ===================== Home ===================== -->
  <main id="screen-home" class="screen screen-center" hidden>
    <header class="brand">
      <div class="brand-logo" aria-hidden="true">
        <span class="mini-card">5</span><span class="mini-card">8</span>
      </div>
      <h1 class="brand-title">Planning Poker</h1>
      <p class="brand-tagline">Estimativas em tempo real com o seu time. Sem login, sem cadastro: crie a sala e compartilhe o link.</p>
    </header>

    <form id="form-create" class="panel" novalidate>
      <h2 class="panel-title">Criar sala</h2>
      <div class="field">
        <label for="create-name">Seu nome</label>
        <input id="create-name" name="name" type="text" autocomplete="nickname" required
               placeholder="Ex.: Ana" aria-describedby="create-name-error">
        <p id="create-name-error" class="field-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="create-room">Nome da sala</label>
        <input id="create-room" name="room" type="text" autocomplete="off" required
               placeholder="Ex.: Sprint 42 · Time Phoenix" aria-describedby="create-room-error">
        <p id="create-room-error" class="field-error" aria-live="polite"></p>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" data-label="Criar sala" data-busy="Criando…">Criar sala</button>
    </form>

    <p class="footnote">Até 10 pessoas por sala · Conexão direta entre navegadores (P2P)</p>
  </main>

  <!-- ===================== Entrar na sala ===================== -->
  <main id="screen-join" class="screen screen-center" hidden>
    <form id="form-join" class="panel" novalidate>
      <p class="eyebrow">Você foi convidado(a)</p>
      <h1 class="panel-title">Entrar na sala <span id="join-room-name" class="accent"></span></h1>
      <p id="join-count" class="muted small"></p>
      <div class="field">
        <label for="join-name">Seu nome</label>
        <input id="join-name" name="name" type="text" autocomplete="nickname" required
               placeholder="Como o time te chama?" aria-describedby="join-name-error">
        <p id="join-name-error" class="field-error" aria-live="polite"></p>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" data-label="Entrar na sala" data-busy="Entrando…">Entrar na sala</button>
    </form>
  </main>

  <!-- ===================== Mensagens (erro / encerrada / cheia) ===================== -->
  <main id="screen-message" class="screen screen-center" hidden>
    <div class="panel panel-message" role="alert">
      <div id="message-icon" class="message-icon" aria-hidden="true"></div>
      <h1 id="message-title" class="panel-title"></h1>
      <p id="message-text" class="muted"></p>
      <div id="message-actions" class="message-actions"></div>
    </div>
  </main>

  <!-- ===================== Sala ===================== -->
  <div id="screen-room" class="screen room" hidden>
    <header class="room-header">
      <div class="room-title">
        <span class="room-logo" aria-hidden="true">🃏</span>
        <h1 id="room-name"></h1>
        <span id="room-count" class="pill"></span>
      </div>
      <div class="header-actions">
        <button id="btn-copy" type="button" class="btn btn-ghost btn-sm">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
          <span class="btn-label">Copiar link</span>
        </button>
        <button id="btn-clear" type="button" class="btn btn-ghost btn-icon" aria-label="Limpar efeitos da tela" title="Limpar efeitos da tela">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
        <div class="sound-ctrl">
          <button id="btn-sound" type="button" class="btn btn-ghost btn-icon" aria-pressed="false" aria-label="Desativar som">
            <span class="icon-sound-on" aria-hidden="true">🔊</span>
            <span class="icon-sound-off" aria-hidden="true" hidden>🔇</span>
          </button>
          <input id="volume" class="volume" type="range" min="0" max="100" step="5" aria-label="Volume dos efeitos">
        </div>
        <button id="btn-leave" type="button" class="btn btn-ghost btn-sm">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          <span class="btn-label">Sair</span>
        </button>
      </div>
    </header>

    <div id="conn-banner" class="banner" role="status" hidden></div>

    <main class="table-area">
      <div id="row-top" class="players-row"></div>
      <section id="table" class="table" aria-label="Mesa">
        <div id="table-center" class="table-center" aria-live="polite"></div>
      </section>
      <div id="row-bottom" class="players-row"></div>
    </main>

    <div class="actions">
      <button id="btn-reveal" type="button" class="btn btn-primary">Revelar votos</button>
      <button id="btn-new-round" type="button" class="btn btn-ghost">Nova votação</button>
    </div>

    <footer class="deck-wrap">
      <p id="deck-label" class="deck-label">Escolha sua carta</p>
      <div id="deck" class="deck" role="group" aria-labelledby="deck-label"></div>
    </footer>
  </div>

  <!-- ===================== Menu de arremesso ===================== -->
  <div id="throw-menu" class="throw-menu" role="dialog" aria-labelledby="throw-title" hidden>
    <div class="throw-head">
      <h2 id="throw-title">Arremessar</h2>
      <button id="throw-close" type="button" class="btn btn-ghost btn-icon btn-xs" aria-label="Fechar">✕</button>
    </div>
    <div id="throw-items" class="throw-grid"></div>
    <p class="throw-sub">Emojis</p>
    <div id="throw-emojis" class="emoji-grid"></div>
    <form id="throw-custom" class="custom-emoji" novalidate>
      <input id="custom-emoji" type="text" maxlength="16" autocomplete="off" placeholder="Outro emoji…" aria-label="Emoji livre" aria-describedby="custom-emoji-error">
      <button type="submit" class="btn btn-primary btn-sm">Jogar</button>
    </form>
    <p id="custom-emoji-error" class="field-error" aria-live="polite"></p>
  </div>

  <!-- Camadas de efeitos -->
  <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
  <canvas id="confetti" class="confetti" aria-hidden="true" hidden></canvas>
  <div id="toast" class="toast-area" role="status" aria-live="polite"></div>

  <!-- PeerJS (versão fixada) + app em ES Modules -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
